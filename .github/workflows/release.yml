name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Package DMG
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R build/SoundSwitch.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "SoundSwitch" -srcfolder "$STAGE" -ov -format UDZO build/SoundSwitch.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/SoundSwitch.dmg \
            --target "$GITHUB_SHA" \
            --title "SoundSwitch $TAG" \
            --notes "Built from $GITHUB_SHA."
